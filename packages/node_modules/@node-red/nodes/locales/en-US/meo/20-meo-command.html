<script type="text/html" data-help-name="meo-command">
    <p>Reads or writes one capability of a MEO device and outputs whatever the device answers.</p>
    <p>Pick a device, one of the capabilities it reported when it was provisioned, and an action.
       <i>Write</i> sends a value — turning an LED on is <code>led</code> with a value of
       <code>1</code>; <code>0</code> turns it off. <i>Read</i> asks the device for its current
       value.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">payload<span class="property-type">number | boolean</span></dt>
        <dd>The value to write, when <b>Value</b> is left as <code>msg.payload</code>. Must be a whole
            number from -32768 to 32767; booleans become <code>1</code> and <code>0</code>, so an
            inject node's true/false works as-is. Ignored for <i>Read</i>.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload<span class="property-type">number</span></dt>
        <dd>The value the device reported back, exactly as the device sent it.</dd>
        <dt>deviceId<span class="property-type">string</span></dt>
        <dd>The device that answered.</dd>
        <dt>cap<span class="property-type">string</span></dt>
        <dd>The capability that was used.</dd>
    </dl>
    <h3>Details</h3>
    <p>The node waits for the device's own reply, so a message only appears on the output once the
       device has actually done the work. If nothing comes back within ten seconds the node fails
       with <i>no reply</i> — usually a device that is powered off or off the network.</p>
    <p>Values are whole numbers. A device that measures decimals usually sends them multiplied by
       100 (<code>2345</code> for 23.45), so divide in a <b>function</b> or <b>change</b> node if
       you need the decimal.</p>
    <p>Failures are reported as node errors, so a <b>catch</b> node can handle them.</p>
    <p>Capabilities are read live from the gateway. If the list is empty, check that the gateway
       is running and that the device finished provisioning.</p>
</script>
