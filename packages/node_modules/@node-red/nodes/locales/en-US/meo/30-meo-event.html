<script type="text/html" data-help-name="meo-event">
    <p>Fires whenever a MEO device sends something on its own — a button press, or a sensor
       reading the device publishes as it takes it.</p>
    <p>This is the opposite of the <i>control</i> node. Control asks a device a question and waits
       for the answer; this node sits and waits for the device to speak first. Reacting to a button
       needs this node.</p>
    <p>Pick a device and, optionally, one of the capabilities it reported when it was provisioned.
       Leave the capability as <i>Anything the device sends</i> to catch everything from that
       device.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload<span class="property-type">number</span></dt>
        <dd>The value the device sent, as a whole number. A button usually sends <code>1</code>; a
            device that measures decimals usually sends them multiplied by 100 (<code>2345</code>
            for 23.45).</dd>
        <dt>topic<span class="property-type">string</span></dt>
        <dd>The capability that fired, such as <code>button</code> or <code>temp</code>. This is the
            capability name, not an MQTT topic.</dd>
        <dt>deviceId<span class="property-type">string</span></dt>
        <dd>The device that sent it.</dd>
        <dt>cap<span class="property-type">string</span></dt>
        <dd>Same as <code>topic</code>.</dd>
    </dl>
    <h3>Details</h3>
    <p>The device has to actually send these — a sketch publishes them by calling
       <code>sendEvent()</code>. A device that never calls it will never fire this node, even for a
       capability it declared.</p>
    <p>Events are sent without delivery guarantees, and nothing is stored: a node that is not
       deployed, or a Node-RED that is restarting, misses whatever arrives meanwhile. Nothing is
       replayed afterwards.</p>
    <p>The node's status shows the connection to the edge, then the last value it saw.</p>
</script>
